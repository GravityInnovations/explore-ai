name: Publish production release

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skills/explore-ai/package-lock.json

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install packaged skill dependencies
        run: npm ci --prefix skills/explore-ai --ignore-scripts --no-audit --no-fund

      - name: Run release validation
        run: npm run check

      - name: Build the installable skill archive
        run: npm pack ./skills/explore-ai --pack-destination "$RUNNER_TEMP"

      - name: Publish the channel release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./skills/explore-ai/package.json').version")"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tag="v${version}-staging.${GITHUB_RUN_NUMBER}"
            title="ExploreAI ${tag}"
            prerelease="--prerelease"
          else
            tag="v${version}"
            title="ExploreAI ${tag}"
            prerelease=""
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          archive="$RUNNER_TEMP/explore-ai-skill-${version}.tgz"
          gh release create "$tag" "$archive" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --generate-notes \
            $prerelease
