name: Evolution checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts, package and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            skills/explain-ai/package-lock.json

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install packaged skill dependencies
        run: npm ci --prefix skills/explain-ai --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for browser evidence
        run: npx playwright install --with-deps chromium

      - name: Run full repository checks
        run: npm run check

      - name: Run browser regression checks
        run: npm run test:e2e
