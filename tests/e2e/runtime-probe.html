<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>ExplainAI runtime probe</title></head>
  <body style="margin:0; min-height:2200px" data-runtime="loading">
    <main>
      <canvas id="lesson-canvas" aria-label="Lesson scene" style="display:block;width:640px;height:360px"></canvas>
      <section id="lesson-section" style="height:900px">Runtime section</section>
    </main>
    <script type="module">
      import * as THREE from "/node_modules/three/build/three.module.js";
      import { gsap } from "/node_modules/gsap/index.js";
      import { ScrollTrigger } from "/node_modules/gsap/ScrollTrigger.js";
      const canvas = document.querySelector("#lesson-canvas");
      const section = document.querySelector("#lesson-section");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      gsap.registerPlugin(ScrollTrigger);
      let progress = 0;
      const trigger = ScrollTrigger.create({ trigger: section, start: "top center", end: "bottom center", onUpdate: (self) => { progress = self.progress; } });
      const resize = () => { const width = Math.max(1, canvas.clientWidth); const height = Math.max(1, canvas.clientHeight); renderer.setSize(width, height, false); camera.aspect = width / height; camera.updateProjectionMatrix(); };
      resize();
      window.addEventListener("resize", resize);
      window.__probe = { scene, camera, renderer, trigger, get progress() { return progress; } };
      window.__disposeProbe = () => { trigger.kill(); window.removeEventListener("resize", resize); renderer.dispose(); document.body.dataset.runtime = "disposed"; };
      document.body.dataset.runtime = "ready";
    </script>
  </body>
</html>
